# Railway service — set Root Directory to `backend` in the Railway dashboard.
# Docs: docs/deploy-vercel-railway.md

[build]
builder = "NIXPACKS"

[deploy]
# Retries migrate for Neon scale-to-zero wake (P1001). See scripts/migrate-deploy-with-retry.mjs
startCommand = "node scripts/migrate-deploy-with-retry.mjs && npm run start:prod"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
